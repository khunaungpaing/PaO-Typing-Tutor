name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS DMG
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Build macOS DMG
        run: |
          chmod +x scripts/build_macos.sh
          ./scripts/build_macos.sh

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Run unit tests
        run: |
          python -m unittest discover tests

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Build Windows Installer
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            dist/*-windows-setup.exe
            dist/*-windows-portable.zip
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*-windows-setup.exe
            artifacts/*-windows-portable.zip
            artifacts/SHA256SUMS.txt
          name: Pa-O Typing Tutor ${{ github.ref_name }}
          draft: false
          prerelease: false
          body: |
            ## Pa-O Typing Tutor ${{ github.ref_name }}

            > **⚠️ IMPORTANT**: This release is specifically designed for the **Pa-O Kham Dom Experimental Version** (`ပအိုဝ်းခမ်းဒွမ် စမ်းသပ်ဗားရှင်း`).

            A modern cross-platform desktop typing tutor for learning, practicing, and mastering the Pa-O language using the **Pa-O Kham Dom Experimental** keyboard layout.

            ---

            ### ✨ Features in this Release
            - **Pa-O Kham Dom Experimental Layout**: Specially tailored keyboard mapping and typing rules built exclusively for the Kham Dom Experimental layout.
            - **Native Pa-O Font Display**: Bundles `KhamThaton-Exp` (`KhamThaton-Exp-Regular`), rendering authentic Pa-O Kham Dom glyphs and complex ligatures natively by default.
            - **Responsive Virtual Keyboard**: Flexible layout with real-time target key highlighting and Shift state synchronization that scales cleanly across small and widescreen displays.
            - **28 Structured Lessons**: Built-in lesson catalog covering basic vowels, consonants, tone marks, vocabulary, and full practice sentences.
            - **Custom Lesson Manager**: Create, edit, and organize personal practice materials, with easy import of custom lessons from UTF-8 JSON and CSV files.
            - **Live Typing Performance Metrics**: Real-time Words Per Minute (WPM), Accuracy percentage, Character count, and session duration.
            - **In-App Auto-Updates**: Automated update checks directly through GitHub Releases with one-click background download & installation.
            - **Localized Interface**: Full user interface localization in **Pa'O** (ပအိုဝ်း), **Burmese** (မြန်မာ), and **English**.
            - **Audio Feedback**: Pleasant auditory cues for keystrokes, errors, and lesson completion, with synthesized tone fallbacks.
            - **100% Offline & Private**: Completely private desktop application with zero telemetry, tracking, or background permissions.

            ---

            ### 📦 Downloads

            | Platform | File | Description |
            | :--- | :--- | :--- |
            | **macOS** | `Pa-O-Typing-Tutor-${{ github.ref_name }}-macos.dmg` | Drag-and-drop installer for macOS 11+ (Intel & Apple Silicon) |
            | **Windows (Setup)** | `Pa-O-Typing-Tutor-${{ github.ref_name }}-windows-setup.exe` | Clean setup wizard for Windows 10 & 11 (64-bit) |
            | **Windows (Portable)** | `Pa-O-Typing-Tutor-${{ github.ref_name }}-windows-portable.zip` | Standalone portable ZIP package (no installation required) |

            ---

            ### 🛡️ First-Launch Security Warnings & Workarounds

            Because this open-source application is not yet code-signed with paid certificates ($99/yr Apple Developer, commercial Windows EV certificate), your operating system will show a standard one-time security warning on first launch.

            #### macOS ("App is damaged" or "Unidentified Developer")
            macOS Gatekeeper blocks unsigned apps downloaded from the internet. To open:
            1. Open **Terminal** (from Applications > Utilities).
            2. Run the following command:
               ```bash
               xattr -cr "/Applications/Pa-O Typing Tutor.app"
               ```
            3. Launch **Pa-O Typing Tutor** normally from Applications or Spotlight.

            *Alternatively: Right-click (or Control-click) the app icon in Finder, choose **Open**, and click **Open** in the dialog.*

            #### Windows 11 Smart App Control ("Smart App Control blocked an app that may be unsafe")
            On Windows 11 (22H2+), **Smart App Control (SAC)** strictly blocks unsigned executable files and installers downloaded from the web (there is no "Run anyway" button in the SAC prompt):
            - **Option A (Recommended)**: Open **Windows Security** > **App & browser control** > **Smart App Control settings** and switch Smart App Control to **Off** (or Evaluation). Then run the setup installer normally.
            - **Option B**: Download the **Portable ZIP** package (`*-windows-portable.zip`), extract it to your preferred folder (e.g. `C:\Users\YourUser\Pa-O Typing Tutor`), and double-click `Pa-O Typing Tutor.exe` to run directly.

            #### Windows Defender SmartScreen ("Windows protected your PC")
            If the standard blue SmartScreen banner appears:
            1. Click **More info**.
            2. Click **Run anyway**.
            3. The installer will proceed normally and install Pa-O Typing Tutor into your Programs folder.

            ---

            ### 🔐 File Integrity Checksums (SHA-256)
            See attached `SHA256SUMS.txt` to verify file integrity.
